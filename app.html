<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Round Table</title>
<script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Barlow', sans-serif; background: #f5f5f5; padding: 20px; }
  h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 18px; color: #E8000A; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
  #status { font-size: 12px; color: #555; margin-bottom: 16px; padding: 10px; background: white; border-radius: 4px; border-left: 3px solid #E8000A; min-height: 40px; }
  #buttons { display: none; flex-direction: column; gap: 10px; }
  button { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; padding: 12px; border: 2px solid #E8000A; background: white; color: #E8000A; cursor: pointer; border-radius: 2px; transition: all 0.15s; }
  button:hover { background: #E8000A; color: white; }
  .hint { font-size: 11px; color: #999; margin-top: 16px; line-height: 1.5; }
</style>
  
  
  <script type="module" crossorigin src="/assets/app.575ef9db.js"></script>
  <link rel="stylesheet" href="/assets/app.f9186f78.css">
</head>
<body>
<h2>Third Round Table</h2>
<div id="status">👆 Seleccioná un frame en el board para activar los botones</div>
<div id="buttons">
  <button onclick="addRow()">＋ Agregar Fila</button>
  <button onclick="addColumn()">＋ Agregar Columna</button>
</div>
<p class="hint">Seleccioná el frame de tu tabla en el board y usá los botones para extenderla.</p>

</body>
</html>
