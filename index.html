<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Round Table</title>
<script src="https://miro.com/app/static/sdk/v2/miro.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  :root {
    --red: #E8000A;
    --green: #006633;
    --black: #111111;
    --border: #ddd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: #f0f0f0;
    padding: 16px;
    height: 100vh;
    overflow: auto;
  }

  .wrapper {
    background: white;
    border-radius: 4px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  }

  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 3px solid var(--red);
  }

  .project-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: underline;
    text-decoration-color: var(--red);
  }

  .project-input {
    border: none;
    border-bottom: 2px solid var(--red);
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    padding: 3px 6px;
    width: 220px;
    outline: none;
    background: transparent;
    margin-top: 4px;
    display: block;
  }

  .logo {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 24px;
    color: var(--red);
    text-transform: uppercase;
    text-shadow: 2px 2px 0 var(--black);
    line-height: 1;
    text-align: right;
  }

  .logo span {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--black);
    text-shadow: none;
    letter-spacing: 3px;
  }

  .outer-wrapper {
    position: relative;
    overflow-x: auto;
  }

  table {
    border-collapse: collapse;
    table-layout: fixed;
    width: 100%;
  }

  thead th {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 8px;
    text-align: left;
    border: 1px solid var(--border);
    white-space: nowrap;
    position: relative;
    min-width: 100px;
  }

  th.th-empty { background: white; border: none; min-width: 70px; }

  th.th-red   { background: var(--red); color: white; }

  th.th-green { background: var(--green); color: white; }

  .remove-col-btn {
    display: none;
    position: absolute;
    top: 2px; right: 3px;
    background: rgba(255,255,255,0.3);
    border: none;
    color: white;
    font-size: 9px;
    width: 13px; height: 13px;
    border-radius: 50%;
    cursor: pointer;
    line-height: 13px;
    text-align: center;
  }

  th:hover .remove-col-btn { display: block; }

  tbody td {
    border: 1px solid var(--border);
    height: 60px;
    padding: 0;
    background: white;
    vertical-align: top;
  }

  td.td-num {
    border: none;
    background: transparent;
    text-align: right;
    padding-right: 8px;
    vertical-align: top;
    padding-top: 6px;
    min-width: 70px;
  }

  .row-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 16px;
    color: var(--red);
    display: block;
  }

  .row-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 9px;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
  }

  .cell-input {
    width: 100%;
    height: 100%;
    min-height: 60px;
    border: none;
    outline: none;
    padding: 6px 8px;
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    background: transparent;
    resize: none;
    overflow: hidden;
  }

  .cell-input:focus { background: #fff8f8; box-shadow: inset 0 0 0 2px var(--red); }

  td.td-actions {
    border: none;
    background: transparent;
    width: 28px;
    text-align: center;
    vertical-align: middle;
  }

  .btn-del-row {
    background: none;
    border: 1px solid #ccc;
    color: #aaa;
    width: 18px; height: 18px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
    line-height: 16px;
    text-align: center;
    padding: 0;
  }

  .btn-del-row:hover { border-color: var(--red); color: var(--red); }

  .bottom-bar {
    display: flex;
    gap: 10px;
    margin-top: 10px;
    justify-content: center;
  }

  .btn-add {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border: 2px solid var(--red);
    background: white;
    color: var(--red);
    padding: 8px 18px;
    transition: all 0.15s;
  }

  .btn-add:hover { background: var(--red); color: white; }

  .add-col-btn-wrapper {
    position: absolute;
    right: -42px;
    top: 0;
    height: 100%;
    display: flex;
    align-items: stretch;
  }

  .btn-add-col-side {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    writing-mode: vertical-rl;
    cursor: pointer;
    border: 2px solid var(--red);
    background: white;
    color: var(--red);
    width: 36px;
    padding: 12px 0;
    transition: all 0.15s;
    border-radius: 4px;
  }

  .btn-add-col-side:hover { background: var(--red); color: white; }

  .toast {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%) translateY(50px);
    background: var(--black);
    color: white;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 12px;
    opacity: 0;
    transition: all 0.25s;
    z-index: 999;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrapper">
  <div class="top-header">
    <div>
      <div class="project-label">Project Name</div>
      <input class="project-input" type="text" placeholder="Nombre del proyecto...">
    </div>
    <div class="logo">THiRD ROUNd <span>Visual Factory</span></div>
  </div>

  <div class="outer-wrapper" id="outerWrapper">
    <table id="mainTable">
      <thead id="tableHead">
        <tr>
          <th class="th-empty"></th>
          <th class="th-red">Camera Location<button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
          <th class="th-red">Assets<button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
          <th class="th-red">Cameras - 1st Pass<button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
          <th class="th-red">Cameras - 2nd Pass<button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
          <th class="th-red">Chosen Camera<button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
          <th class="th-green">First Round<button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
          <th class="th-green">Second Round<button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
          <th class="th-green">Third Round<button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
          <th class="th-empty" style="width:28px;"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="add-col-btn-wrapper" id="addColWrapper">
      <button class="btn-add-col-side" onclick="addColumn()">+ Add Column</button>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="btn-add" onclick="addRow()">＋ Add Row</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  let rowCount = 0;

  function getDataColCount() {
    const hr = document.getElementById('tableHead').rows[0];
    return hr.cells.length - 2; // minus num + actions
  }

  function addRow() {
    rowCount++;
    const tbody = document.getElementById('tableBody');
    const dataCols = getDataColCount();
    const tr = document.createElement('tr');

    // Number cell
    const tdNum = document.createElement('td');
    tdNum.className = 'td-num';
    tdNum.innerHTML = `<span class="row-number">O${String(rowCount).padStart(2,'0')}</span><span class="row-label">Image Name</span>`;
    tr.appendChild(tdNum);

    // Data cells
    for (let c = 0; c < dataCols; c++) {
      const td = document.createElement('td');
      const ta = document.createElement('textarea');
      ta.className = 'cell-input';
      ta.rows = 2;
      td.appendChild(ta);
      tr.appendChild(td);
    }

    // Delete button
    const tdAct = document.createElement('td');
    tdAct.className = 'td-actions';
    tdAct.innerHTML = `<button class="btn-del-row" onclick="removeRow(this)">✕</button>`;
    tr.appendChild(tdAct);

    tbody.appendChild(tr);
    updateColHeight();
    showToast(`Fila O${String(rowCount).padStart(2,'0')} agregada`);
  }

  function removeRow(btn) {
    btn.closest('tr').remove();
    renumber();
    updateColHeight();
    showToast('Fila eliminada');
  }

  function renumber() {
    const rows = document.getElementById('tableBody').rows;
    rowCount = rows.length;
    for (let i = 0; i < rows.length; i++) {
      rows[i].cells[0].innerHTML = `<span class="row-number">O${String(i+1).padStart(2,'0')}</span><span class="row-label">Image Name</span>`;
    }
  }

  function addColumn() {
    const hr = document.getElementById('tableHead').rows[0];
    const actCell = hr.cells[hr.cells.length - 1];
    const th = document.createElement('th');
    th.className = 'th-green';
    th.innerHTML = `<span contenteditable="true" style="outline:none;display:inline-block;width:calc(100% - 16px)">Nueva Columna</span><button class="remove-col-btn" onclick="removeCol(this)" style="display:inline-block">✕</button>`;
    hr.insertBefore(th, actCell);

    const rows = document.getElementById('tableBody').rows;
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const act = row.cells[row.cells.length - 1];
      const td = document.createElement('td');
      const ta = document.createElement('textarea');
      ta.className = 'cell-input';
      ta.rows = 2;
      td.appendChild(ta);
      row.insertBefore(td, act);
    }

    updateColHeight();
    showToast('Columna agregada');
  }

  function removeCol(btn) {
    const th = btn.closest('th');
    const hr = document.getElementById('tableHead').rows[0];
    const idx = Array.from(hr.cells).indexOf(th);
    if (getDataColCount() <= 1) { showToast('Debe quedar al menos una columna'); return; }
    th.remove();
    const rows = document.getElementById('tableBody').rows;
    for (let i = 0; i < rows.length; i++) rows[i].deleteCell(idx);
    showToast('Columna eliminada');
  }

  function updateColHeight() {
    const t = document.getElementById('mainTable');
    document.getElementById('addColWrapper').style.height = t.offsetHeight + 'px';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  window.onload = () => {
    for (let i = 0; i < 5; i++) addRow();
    updateColHeight();
  };

  window.addEventListener('resize', updateColHeight);
</script>
</body>
</html>
