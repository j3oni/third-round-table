<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Round Visual Factory</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  :root {
    --red: #E8000A;
    --dark-red: #B50008;
    --green: #006633;
    --dark-green: #004d26;
    --black: #111111;
    --white: #ffffff;
    --light-gray: #f5f5f5;
    --border: #ddd;
    --cell-bg: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: #e8e8e8;
    min-height: 100vh;
    padding: 24px;
  }

  .wrapper {
    background: white;
    border-radius: 4px;
    padding: 20px;
    max-width: 100%;
    overflow-x: auto;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
  }

  /* HEADER */
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 3px solid var(--red);
  }

  .project-name-block {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .project-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--black);
    text-decoration: underline;
    text-decoration-color: var(--red);
    text-underline-offset: 3px;
  }

  .project-input {
    border: none;
    border-bottom: 2px solid var(--red);
    font-family: 'Barlow', sans-serif;
    font-size: 14px;
    padding: 4px 8px;
    width: 260px;
    outline: none;
    color: var(--black);
    background: transparent;
  }

  .logo {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 28px;
    color: var(--red);
    text-transform: uppercase;
    letter-spacing: 1px;
    line-height: 1;
    text-shadow: 3px 3px 0 var(--black);
    position: relative;
  }

  .logo span {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--black);
    text-shadow: none;
    letter-spacing: 3px;
    text-align: right;
  }

  /* TABLE CONTAINER */
  .table-container {
    position: relative;
    display: inline-block;
    min-width: 100%;
  }

  /* TABLE */
  table {
    border-collapse: collapse;
    table-layout: fixed;
  }

  /* FIXED COLUMN WIDTHS */
  .col-type    { width: 60px; }
  .col-num     { width: 80px; }
  .col-cam     { width: 130px; }
  .col-assets  { width: 150px; }
  .col-std     { width: 140px; }

  /* HEADER CELLS */
  thead th {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 8px;
    text-align: left;
    white-space: nowrap;
    border: 1px solid var(--border);
    position: relative;
  }

  th.th-type { background: white; border: none; }
  th.th-num  { background: white; border: none; }

  th.th-cam    { background: var(--red); color: white; }
  th.th-assets { background: var(--red); color: white; }
  th.th-cam1   { background: var(--red); color: white; }
  th.th-cam2   { background: var(--red); color: white; }
  th.th-chosen { background: var(--red); color: white; }
  th.th-first  { background: var(--green); color: white; }
  th.th-second { background: var(--green); color: white; }
  th.th-third  { background: var(--green); color: white; }

  /* REMOVE-COLUMN BUTTON in header */
  th .remove-col-btn {
    display: none;
    position: absolute;
    top: 2px;
    right: 3px;
    background: rgba(255,255,255,0.25);
    border: none;
    color: white;
    font-size: 10px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    cursor: pointer;
    line-height: 14px;
    text-align: center;
    font-weight: 900;
  }

  th:hover .remove-col-btn { display: block; }

  /* BODY CELLS */
  tbody td {
    border: 1px solid var(--border);
    vertical-align: top;
    padding: 0;
    background: var(--cell-bg);
    min-height: 64px;
    height: 64px;
  }

  td.td-type {
    border: none;
    background: transparent;
    text-align: right;
    padding-right: 10px;
    vertical-align: middle;
  }

  td.td-num {
    border: none;
    background: transparent;
    text-align: right;
    padding-right: 10px;
    vertical-align: top;
    padding-top: 6px;
  }

  .row-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 18px;
    color: var(--red);
    display: block;
  }

  .row-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 10px;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
  }

  .cell-input {
    width: 100%;
    height: 100%;
    min-height: 64px;
    border: none;
    outline: none;
    padding: 6px 8px;
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    color: var(--black);
    background: transparent;
    resize: none;
    overflow: hidden;
  }

  .cell-input:focus {
    background: #fff8f8;
    box-shadow: inset 0 0 0 2px var(--red);
  }

  td:hover .cell-input { background: #fafafa; }

  /* TYPE LABEL */
  .type-label-cell {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 22px;
    text-transform: uppercase;
    letter-spacing: 3px;
    color: var(--black);
    padding: 12px 0;
    text-align: center;
  }

  /* ROW ACTIONS */
  .row-actions {
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: center;
    justify-content: center;
    padding: 4px;
    border: none;
    background: transparent;
  }

  /* ACTION BUTTONS */
  .btn-add-row, .btn-add-col, .btn-del-row {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid var(--red);
    background: white;
    color: var(--red);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 12px;
  }

  .btn-del-row {
    border-color: #ccc;
    color: #aaa;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 14px;
    padding: 0;
    flex-shrink: 0;
  }

  .btn-del-row:hover { border-color: var(--red); color: var(--red); background: #fff0f0; }

  .btn-add-row {
    width: 100%;
    padding: 10px 20px;
    margin-top: 10px;
    font-size: 14px;
  }

  .btn-add-row:hover, .btn-add-col:hover {
    background: var(--red);
    color: white;
  }

  /* ADD COLUMN BUTTON — right side */
  .add-col-wrapper {
    position: absolute;
    right: -50px;
    top: 0;
    height: 100%;
    width: 44px;
    display: flex;
    align-items: flex-start;
    padding-top: 0;
  }

  .btn-add-col {
    writing-mode: vertical-rl;
    padding: 16px 8px;
    border: 2px solid var(--red);
    font-size: 12px;
    height: 100%;
    width: 38px;
    border-radius: 4px;
    justify-content: center;
  }

  .btn-add-col:hover {
    background: var(--red);
    color: white;
  }

  /* BOTTOM TOOLBAR */
  .bottom-bar {
    display: flex;
    justify-content: center;
    margin-top: 12px;
    gap: 12px;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--black);
    color: white;
    padding: 10px 20px;
    border-radius: 4px;
    font-family: 'Barlow', sans-serif;
    font-size: 13px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 999;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* RIGHT-SIDE ADD COLUMN AREA */
  .outer-wrapper {
    position: relative;
    display: inline-block;
    width: 100%;
  }
</style>
</head>
<body>

<div class="wrapper">
  <!-- HEADER -->
  <div class="top-header">
    <div class="project-name-block">
      <span class="project-label">Project Name</span>
      <input class="project-input" type="text" placeholder="Escribe el nombre del proyecto...">
    </div>
    <div class="logo">
      THiRD ROUNd
      <span>Visual Factory</span>
    </div>
  </div>

  <!-- OUTER WRAPPER for table + add-col button -->
  <div class="outer-wrapper" id="outerWrapper">
    <div class="table-container" id="tableContainer">
      <table id="mainTable">
        <thead id="tableHead">
          <tr>
            <th class="th-type col-type"></th>
            <th class="th-num col-num"></th>
            <th class="th-cam col-cam">Camera Location <button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
            <th class="th-assets col-assets">Assets <button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
            <th class="th-cam1 col-std">Cameras - 1st Pass <button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
            <th class="th-cam2 col-std">Cameras - 2nd Pass <button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
            <th class="th-chosen col-std">Chosen Camera <button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
            <th class="th-first col-std">First Round <button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
            <th class="th-second col-std">Second Round <button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
            <th class="th-third col-std">Third Round <button class="remove-col-btn" onclick="removeCol(this)">✕</button></th>
            <th class="th-actions" style="border:none;background:transparent;width:30px;"></th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>

    <!-- ADD COLUMN BUTTON -->
    <div class="add-col-wrapper" id="addColWrapper">
      <button class="btn-add-col" onclick="addColumn()">+ Add Column</button>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <button class="btn-add-row" onclick="addRow()">＋ Add Row</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let rowCount = 0;
  let colCount = 0; // extra custom columns beyond defaults
  const DEFAULT_COLS = 8; // cam location, assets, cam1, cam2, chosen, first, second, third

  // Track col indices (beyond the fixed type/num + actions cols)
  // thead tr children: 0=type, 1=num, [2..N-1]=data cols, N=actions

  function getDataColCount() {
    const headerRow = document.getElementById('tableHead').rows[0];
    return headerRow.cells.length - 3; // minus type, num, actions
  }

  function addRow() {
    rowCount++;
    const tbody = document.getElementById('tableBody');
    const headerRow = document.getElementById('tableHead').rows[0];
    const dataCols = getDataColCount();

    const tr = document.createElement('tr');
    tr.dataset.rowId = rowCount;

    // TYPE cell (only for first row in a "type group" — simplified: always show)
    const tdType = document.createElement('td');
    tdType.className = 'td-type';
    if (rowCount === 1) {
      tdType.rowSpan = 1;
      tdType.innerHTML = `<div class="type-label-cell">Type</div>`;
    }
    tr.appendChild(tdType);

    // NUMBER cell
    const tdNum = document.createElement('td');
    tdNum.className = 'td-num';
    tdNum.innerHTML = `
      <span class="row-number">O${String(rowCount).padStart(2,'0')}</span>
      <span class="row-label">Image Name</span>
    `;
    tr.appendChild(tdNum);

    // DATA CELLS
    for (let c = 0; c < dataCols; c++) {
      const td = document.createElement('td');
      const ta = document.createElement('textarea');
      ta.className = 'cell-input';
      ta.rows = 2;
      ta.placeholder = '';
      td.appendChild(ta);
      tr.appendChild(td);
    }

    // ACTIONS cell (delete row)
    const tdAct = document.createElement('td');
    tdAct.className = 'row-actions';
    tdAct.style.border = 'none';
    tdAct.style.background = 'transparent';
    tdAct.style.width = '30px';
    tdAct.innerHTML = `<button class="btn-del-row" onclick="removeRow(this)" title="Eliminar fila">✕</button>`;
    tr.appendChild(tdAct);

    tbody.appendChild(tr);
    updateAddColHeight();
    showToast(`Fila O${String(rowCount).padStart(2,'0')} agregada`);
  }

  function removeRow(btn) {
    const tr = btn.closest('tr');
    tr.remove();
    renumberRows();
    updateAddColHeight();
    showToast('Fila eliminada');
  }

  function renumberRows() {
    const rows = document.getElementById('tableBody').rows;
    rowCount = rows.length;
    for (let i = 0; i < rows.length; i++) {
      const numCell = rows[i].cells[1];
      numCell.innerHTML = `
        <span class="row-number">O${String(i+1).padStart(2,'0')}</span>
        <span class="row-label">Image Name</span>
      `;
    }
  }

  function addColumn() {
    colCount++;
    const headerRow = document.getElementById('tableHead').rows[0];
    const actionsCell = headerRow.cells[headerRow.cells.length - 1];

    // Add new th before actions cell
    const newTh = document.createElement('th');
    newTh.className = 'th-second col-std';
    newTh.innerHTML = `<span contenteditable="true" style="outline:none;display:inline-block;width:calc(100% - 18px)">Nueva Columna ${colCount}</span> <button class="remove-col-btn" onclick="removeCol(this)" style="display:inline-block;">✕</button>`;
    headerRow.insertBefore(newTh, actionsCell);

    // Add cells to each body row
    const rows = document.getElementById('tableBody').rows;
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const actCell = row.cells[row.cells.length - 1];
      const td = document.createElement('td');
      const ta = document.createElement('textarea');
      ta.className = 'cell-input';
      ta.rows = 2;
      td.appendChild(ta);
      row.insertBefore(td, actCell);
    }

    updateAddColHeight();
    showToast(`Columna agregada`);
  }

  function removeCol(btn) {
    const th = btn.closest('th');
    const headerRow = document.getElementById('tableHead').rows[0];
    const cells = Array.from(headerRow.cells);
    const colIdx = cells.indexOf(th);

    if (colIdx < 2) return; // protect type/num
    const dataColCount = getDataColCount();
    if (dataColCount <= 1) { showToast('Debe quedar al menos una columna'); return; }

    // Remove th
    th.remove();

    // Remove corresponding cell from each body row
    const rows = document.getElementById('tableBody').rows;
    for (let i = 0; i < rows.length; i++) {
      rows[i].deleteCell(colIdx);
    }

    showToast('Columna eliminada');
  }

  function updateAddColHeight() {
    const container = document.getElementById('tableContainer');
    const wrapper = document.getElementById('addColWrapper');
    wrapper.style.height = container.offsetHeight + 'px';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Initialize with 5 default rows
  window.onload = () => {
    for (let i = 0; i < 5; i++) addRow();
    updateAddColHeight();
  };

  window.addEventListener('resize', updateAddColHeight);
</script>
</body>
</html>
