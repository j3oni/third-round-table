<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Third Round Visual Factory</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  :root {
    --red: #E8000A;
    --green: #006633;
    --black: #111111;
    --border: #ddd;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: #e8e8e8;
    min-height: 100vh;
    padding: 20px;
  }

  .wrapper {
    background: white;
    border-radius: 4px;
    padding: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    max-width: 100%;
  }

  /* HEADER */
  .top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 3px solid var(--red);
  }

  .project-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: underline;
    text-decoration-color: var(--red);
    text-underline-offset: 3px;
  }

  .project-input {
    border: none;
    border-bottom: 2px solid var(--red);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 16px;
    padding: 3px 6px;
    width: 280px;
    outline: none;
    background: transparent;
    margin-top: 4px;
    display: block;
    color: var(--black);
  }

  .logo {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 26px;
    color: var(--red);
    text-transform: uppercase;
    text-shadow: 3px 3px 0 var(--black);
    line-height: 1;
    text-align: right;
  }

  .logo span {
    display: block;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--black);
    text-shadow: none;
    letter-spacing: 3px;
  }

  /* SYNC STATUS */
  .sync-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    color: #666;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .sync-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ccc;
    transition: background 0.3s;
  }

  .sync-dot.synced { background: var(--green); }
  .sync-dot.syncing { background: orange; animation: pulse 0.8s infinite; }
  .sync-dot.error { background: var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* TABLE */
  .outer-wrapper {
    position: relative;
    overflow-x: auto;
    padding-right: 48px;
    padding-bottom: 48px;
  }

  table {
    border-collapse: collapse;
    table-layout: auto;
  }

  thead th {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 8px;
    text-align: left;
    border: 1px solid var(--border);
    white-space: nowrap;
    position: relative;
    min-width: 110px;
  }

  th.th-empty { background: white; border: none; min-width: 70px; }
  th.th-red { background: var(--red); color: white; }
  th.th-green { background: var(--green); color: white; }

  th .col-name {
    outline: none;
    display: inline-block;
    width: calc(100% - 18px);
    cursor: text;
  }

  .remove-col-btn {
    display: none;
    position: absolute;
    top: 2px; right: 3px;
    background: rgba(255,255,255,0.3);
    border: none;
    color: white;
    font-size: 9px;
    width: 13px; height: 13px;
    border-radius: 50%;
    cursor: pointer;
    line-height: 13px;
    text-align: center;
  }
  th:hover .remove-col-btn { display: block; }

  tbody td {
    border: 1px solid var(--border);
    height: 64px;
    padding: 0;
    background: white;
    vertical-align: top;
  }

  td.td-num {
    border: none;
    background: transparent;
    text-align: right;
    padding-right: 8px;
    vertical-align: top;
    padding-top: 6px;
    min-width: 70px;
    position: relative;
  }

  .row-number {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 16px;
    color: var(--red);
    display: block;
  }

  .row-sublabel {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 9px;
    color: var(--green);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: block;
    outline: none;
    cursor: text;
  }

  .cell-input {
    width: 100%;
    height: 100%;
    min-height: 64px;
    border: none;
    outline: none;
    padding: 6px 8px;
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    background: transparent;
    resize: none;
    overflow: hidden;
  }

  .cell-input:focus { background: #fff8f8; box-shadow: inset 0 0 0 2px var(--red); }

  td.td-actions {
    border: none;
    background: transparent;
    width: 24px;
    text-align: center;
    vertical-align: middle;
  }

  .btn-del-row {
    background: none;
    border: 1px solid #ccc;
    color: #aaa;
    width: 18px; height: 18px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
    line-height: 16px;
    text-align: center;
    padding: 0;
    opacity: 0;
    transition: opacity 0.15s;
  }

  tr:hover .btn-del-row { opacity: 1; }
  .btn-del-row:hover { border-color: var(--red); color: var(--red); }

  /* ADD ROW BUTTON */
  .add-row-wrapper {
    position: absolute;
    bottom: 0;
    left: 0;
    width: calc(100% - 48px);
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-add-row {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    border: 2px solid var(--red);
    background: white;
    color: var(--red);
    padding: 6px 20px;
    transition: all 0.15s;
    border-radius: 2px;
  }
  .btn-add-row:hover { background: var(--red); color: white; }

  /* ADD COLUMN BUTTON */
  .add-col-wrapper {
    position: absolute;
    right: 0;
    top: 0;
    width: 44px;
    height: calc(100% - 48px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-add-col {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    writing-mode: vertical-rl;
    cursor: pointer;
    border: 2px solid var(--red);
    background: white;
    color: var(--red);
    width: 36px;
    height: 100%;
    transition: all 0.15s;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-add-col:hover { background: var(--red); color: white; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 16px; left: 50%;
    transform: translateX(-50%) translateY(50px);
    background: var(--black);
    color: white;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 12px;
    opacity: 0;
    transition: all 0.25s;
    z-index: 999;
    font-family: 'Barlow', sans-serif;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="wrapper">
  <div class="top-header">
    <div>
      <div class="project-label">Project Name</div>
      <input class="project-input" id="projectName" type="text" placeholder="Nombre del proyecto...">
    </div>
    <div class="logo">THiRD ROUNd <span>Visual Factory</span></div>
  </div>

  <div class="sync-bar">
    <div class="sync-dot" id="syncDot"></div>
    <span id="syncStatus">Conectando...</span>
  </div>

  <div class="outer-wrapper" id="outerWrapper">
    <table id="mainTable">
      <thead id="tableHead">
        <tr id="headerRow">
          <th class="th-empty"></th>
          <!-- cols added dynamically -->
          <th class="th-empty" style="width:24px; min-width:24px; border:none;"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <div class="add-col-wrapper">
      <button class="btn-add-col" onclick="addColumn()">+ Add Column</button>
    </div>

    <div class="add-row-wrapper">
      <button class="btn-add-row" onclick="addRow()">＋ Add Row</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, update, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAgvIEgZ5npqGvlnoFMXzbleTJ2JUjsnyo",
    authDomain: "third-round-table.firebaseapp.com",
    databaseURL: "https://third-round-table-default-rtdb.firebaseio.com",
    projectId: "third-round-table",
    storageBucket: "third-round-table.firebasestorage.app",
    messagingSenderId: "313208561211",
    appId: "1:313208561211:web:b591c57fef138fe24ec61e"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // State
  let state = { projectName: '', columns: [], rows: [] };
  let isLocalUpdate = false;

  function setSyncStatus(status) {
    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncStatus');
    dot.className = 'sync-dot ' + status;
    const labels = { synced: 'Sincronizado', syncing: 'Guardando...', error: 'Error de conexión', '': 'Conectando...' };
    txt.textContent = labels[status] || 'Conectando...';
  }

  // LISTEN to Firebase
  const tableRef = ref(db, 'table');
  onValue(tableRef, (snapshot) => {
    if (isLocalUpdate) return;
    const data = snapshot.val();
    if (data) {
      state = {
        projectName: data.projectName || '',
        columns: data.columns || getDefaultColumns(),
        rows: data.rows || []
      };
    } else {
      state = {
        projectName: '',
        columns: getDefaultColumns(),
        rows: []
      };
      saveToFirebase();
    }
    renderAll();
    setSyncStatus('synced');
  }, (error) => {
    setSyncStatus('error');
  });

  function getDefaultColumns() {
    return [
      { id: 'c1', name: 'Camera Location', color: 'red' },
      { id: 'c2', name: 'Assets', color: 'red' },
      { id: 'c3', name: 'Cameras - 1st Pass', color: 'red' },
      { id: 'c4', name: 'Cameras - 2nd Pass', color: 'red' },
      { id: 'c5', name: 'Chosen Camera', color: 'red' },
      { id: 'c6', name: 'First Round', color: 'green' },
      { id: 'c7', name: 'Second Round', color: 'green' },
      { id: 'c8', name: 'Third Round', color: 'green' },
    ];
  }

  function saveToFirebase() {
    setSyncStatus('syncing');
    isLocalUpdate = true;
    set(ref(db, 'table'), state).then(() => {
      setSyncStatus('synced');
      setTimeout(() => { isLocalUpdate = false; }, 500);
    }).catch(() => {
      setSyncStatus('error');
      isLocalUpdate = false;
    });
  }

  function renderAll() {
    renderHeader();
    renderBody();
    document.getElementById('projectName').value = state.projectName;
    updateWrapperSize();
  }

  function renderHeader() {
    const headerRow = document.getElementById('headerRow');
    // Clear all except first (empty) and last (actions)
    while (headerRow.children.length > 1) {
      headerRow.removeChild(headerRow.lastChild);
    }

    // Add last empty actions th
    const actTh = document.createElement('th');
    actTh.className = 'th-empty';
    actTh.style.cssText = 'width:24px;min-width:24px;border:none;';

    state.columns.forEach(col => {
      const th = document.createElement('th');
      th.className = col.color === 'green' ? 'th-green' : 'th-red';
      th.dataset.colId = col.id;
      th.innerHTML = `<span class="col-name" contenteditable="true" data-col-id="${col.id}">${col.name}</span><button class="remove-col-btn" data-col-id="${col.id}">✕</button>`;
      headerRow.appendChild(th);
    });

    headerRow.appendChild(actTh);

    // Events on col names
    headerRow.querySelectorAll('.col-name').forEach(el => {
      el.addEventListener('blur', (e) => {
        const colId = e.target.dataset.colId;
        const col = state.columns.find(c => c.id === colId);
        if (col) {
          col.name = e.target.textContent.trim();
          saveToFirebase();
        }
      });
    });

    // Events on remove col buttons
    headerRow.querySelectorAll('.remove-col-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const colId = e.target.dataset.colId;
        if (state.columns.length <= 1) { showToast('Debe quedar al menos una columna'); return; }
        state.columns = state.columns.filter(c => c.id !== colId);
        state.rows.forEach(row => { delete row.cells[colId]; });
        saveToFirebase();
      });
    });
  }

  function renderBody() {
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';

    state.rows.forEach((row, i) => {
      const tr = document.createElement('tr');

      // Number cell
      const tdNum = document.createElement('td');
      tdNum.className = 'td-num';
      tdNum.innerHTML = `
        <span class="row-number">O${String(i+1).padStart(2,'0')}</span>
        <span class="row-sublabel" contenteditable="true" data-row-id="${row.id}" data-field="label">${row.label || 'Image Name'}</span>
      `;
      tr.appendChild(tdNum);

      // Data cells
      state.columns.forEach(col => {
        const td = document.createElement('td');
        const ta = document.createElement('textarea');
        ta.className = 'cell-input';
        ta.value = (row.cells && row.cells[col.id]) || '';
        ta.dataset.rowId = row.id;
        ta.dataset.colId = col.id;
        ta.addEventListener('input', (e) => {
          const r = state.rows.find(r => r.id === e.target.dataset.rowId);
          if (r) {
            if (!r.cells) r.cells = {};
            r.cells[e.target.dataset.colId] = e.target.value;
            saveToFirebase();
          }
        });
        td.appendChild(ta);
        tr.appendChild(td);
      });

      // Delete button
      const tdAct = document.createElement('td');
      tdAct.className = 'td-actions';
      const delBtn = document.createElement('button');
      delBtn.className = 'btn-del-row';
      delBtn.textContent = '✕';
      delBtn.dataset.rowId = row.id;
      delBtn.addEventListener('click', (e) => {
        const rowId = e.target.dataset.rowId;
        state.rows = state.rows.filter(r => r.id !== rowId);
        saveToFirebase();
        showToast('Fila eliminada');
      });
      tdAct.appendChild(delBtn);
      tr.appendChild(tdAct);

      tbody.appendChild(tr);
    });

    // Label edit events
    tbody.querySelectorAll('.row-sublabel').forEach(el => {
      el.addEventListener('blur', (e) => {
        const rowId = e.target.dataset.rowId;
        const row = state.rows.find(r => r.id === rowId);
        if (row) {
          row.label = e.target.textContent.trim();
          saveToFirebase();
        }
      });
    });
  }

  function updateWrapperSize() {
    const table = document.getElementById('mainTable');
    const outer = document.getElementById('outerWrapper');
    // heights update naturally
  }

  // ADD ROW
  window.addRow = function() {
    const newRow = {
      id: 'r' + Date.now(),
      label: 'Image Name',
      cells: {}
    };
    state.rows.push(newRow);
    saveToFirebase();
    showToast(`Fila O${String(state.rows.length).padStart(2,'0')} agregada`);
  };

  // ADD COLUMN
  window.addColumn = function() {
    const newCol = {
      id: 'c' + Date.now(),
      name: 'Nueva Columna',
      color: 'green'
    };
    state.columns.push(newCol);
    saveToFirebase();
    showToast('Columna agregada');
  };

  // PROJECT NAME
  document.getElementById('projectName').addEventListener('input', (e) => {
    state.projectName = e.target.value;
    saveToFirebase();
  });

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  setSyncStatus('');
</script>
</body>
</html>
